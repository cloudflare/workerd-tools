name: Release WPT

on:
  schedule:
    # Runs at 00:15, only on Sunday.
    - cron: "15 00 * * 0" 
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch name to fetch'
        default: master

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WPT
        uses: actions/checkout@v7
        with:
          repository: 'web-platform-tests/wpt'
          ref: ${{ inputs.ref }}
      - name: Create Github Release
        shell: bash
        run: |
          RELEASE_NAME=wpt-$(git rev-parse --short HEAD)
          gh release create -R ${{ github.repository }} $RELEASE_NAME || true
          
          # Excludes ~70% of files, making this archive faster to process
          EXCLUDES=(':(exclude)css' ':(exclude)conformance-checkers' ':(exclude)svg')
          # Keep html/webappapis but exclude the rest of html/. A pathspec
          # exclude can't be undone by a later include, so exclude each
          # other top-level entry of html/ individually.
          while IFS= read -r -d '' ENTRY; do
            [[ "$ENTRY" == 'html/webappapis' ]] || EXCLUDES+=(":(exclude,literal)$ENTRY")
          done < <(git ls-tree -z --name-only HEAD html/)
          # REVISION holds the full hash of the commit, which the release name abbreviates.
          # --add-virtual-file needs git 2.38 or later.
          git archive --prefix=$RELEASE_NAME/ --add-virtual-file="$RELEASE_NAME/REVISION:$(git rev-parse HEAD)" \
            -o $RELEASE_NAME.tar.gz HEAD "${EXCLUDES[@]}"
          
          gh release upload -R ${{ github.repository }} $RELEASE_NAME $RELEASE_NAME.tar.gz
        env:
          GITHUB_TOKEN: ${{ github.TOKEN }}
